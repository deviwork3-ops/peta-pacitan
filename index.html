<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Rumah Pacitan</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }
  #cari { position: absolute; z-index: 1000; top: 10px; left: 50px; right: 10px;
          padding: 10px; font-size: 16px; border: 1px solid #999; border-radius: 8px; }
  #peta { height: 100%; }
</style>
</head>
<body>
<input id="cari" placeholder="Cari nama pemilik rumah...">
<div id="peta"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyRdG5LJuBzZGrGWysgOBAI_Cuz0_FB6d-0COhoXO-9u96gIQd894RgcucE-iiDYLkwHA/exec';
const batas = L.latLngBounds([-8.45, 110.70], [-7.95, 111.55]);
const peta = L.map('peta', { maxBounds: batas, maxBoundsViscosity: 1.0, minZoom: 10 })
  .setView([-8.20, 111.10], 11);
const petaBiasa = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 19
});
const satelit = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 18
  });
  satelit.addTo(peta);
  L.control.layers({ 'Satelit': satelit, 'Peta': petaBiasa }).addTo(peta);


const penanda = {};

function kirim(data) {
  return fetch(API, { method: 'POST', body: JSON.stringify(data) });
}

function pasang(d) {
  const m = L.marker([d.lat, d.lng]).addTo(peta);
  m.on('click', function () { if (modeGaris) { m.closePopup(); pilihUntukGaris(d.id); } });
  m.nama = d.nama;
  m.bindPopup(function () {
    const div = document.createElement('div');
    div.innerHTML = '<b>' + d.nama + '</b><br>' + (d.catatan || '') + '<br>';
    const ubah = document.createElement('button');
    ubah.textContent = 'Ubah';
    ubah.onclick = function () {
      const n = prompt('Nama pemilik rumah:', d.nama);
      if (n === null) return;
      const c = prompt('Catatan:', d.catatan || '');
      d.nama = n; d.catatan = c || '';
      m.nama = n;
      kirim({ aksi: 'ubah', id: d.id, nama: d.nama, lat: d.lat, lng: d.lng, catatan: d.catatan });
      m.closePopup();
    };
    const hapus = document.createElement('button');
    hapus.textContent = 'Hapus';
    hapus.onclick = function () {
      if (!confirm('Hapus penanda ini?')) return;
      kirim({ aksi: 'hapus', id: d.id });
      peta.removeLayer(m);
      delete penanda[d.id];
    };
    div.appendChild(ubah);
    div.appendChild(hapus);
    return div;
  });
  penanda[d.id] = m;
}

const garisan = {};
const WARNA = { merah: '#e53935', hijau: '#43a047', kuning: '#fdd835', biru: '#1e88e5', hitam: '#000000' };

function pasangGaris(g) {
  const a = penanda[g.dari];
  const b = penanda[g.ke];
  if (!a || !b) return;
  const garis = L.polyline([a.getLatLng(), b.getLatLng()], {
    color: WARNA[g.warna] || '#000000', weight: 5
  }).addTo(peta);
  garis.bindPopup(function () {
    const div = document.createElement('div');
    div.innerHTML = 'Garis ' + a.nama + ' ke ' + b.nama + '<br>';
    const hapus = document.createElement('button');
    hapus.textContent = 'Hapus garis';
    hapus.onclick = function () {
      kirim({ aksi: 'hapusGaris', id: g.id });
      peta.removeLayer(garis);
      delete garisan[g.id];
    };
    div.appendChild(hapus);
    return div;
  });
  garisan[g.id] = garis;
}



  let modeGaris = false;
  let modeBebas = false;
let titikAwal = null;

const panel = document.createElement('div');
panel.style.cssText = 'position:absolute;z-index:1000;left:10px;bottom:25px;background:white;padding:8px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.4)';
panel.innerHTML = '<button id="btnGaris">Buat Garis</button> ' +
  '<select id="pilihWarna">' +
  '<option value="merah">Merah</option>' +
  '<option value="hijau">Hijau</option>' +
  '<option value="kuning">Kuning</option>' +
  '<option value="biru">Biru</option>' +
  '<option value="hitam">Hitam</option>' +
  '</select><div id="infoGaris" style="margin-top:4px;font-size:13px"></div>';
document.body.appendChild(panel);

document.getElementById('btnGaris').onclick = function () {
  modeGaris = !modeGaris;
  titikAwal = null;
  this.textContent = modeGaris ? 'Batal' : 'Buat Garis';
  document.getElementById('infoGaris').textContent = modeGaris ? 'Ketuk rumah pertama' : '';
};

function pilihUntukGaris(id) {
  const info = document.getElementById('infoGaris');
  if (titikAwal === null) {
    titikAwal = id;
    info.textContent = 'Ketuk rumah kedua';
    return;
  }
  if (id === titikAwal) return;
  const g = { id: Date.now(), dari: titikAwal, ke: id,
              warna: document.getElementById('pilihWarna').value };
  pasangGaris(g);
  kirim(Object.assign({ aksi: 'tambahGaris' }, g));
  titikAwal = null;
  modeGaris = false;
  document.getElementById('btnGaris').textContent = 'Buat Garis';
  info.textContent = '';
}

peta.on('click', function (e) {if (modeGaris || modeBebas) return; 
  const nama = prompt('Rumah siapa di titik ini?');
  if (!nama) return;
  const catatan = prompt('Catatan (boleh kosong):') || '';
  const d = { id: Date.now(), nama: nama, lat: e.latlng.lat, lng: e.latlng.lng, catatan: catatan };
  pasang(d);
  kirim(Object.assign({ aksi: 'tambah' }, d));
});

document.getElementById('cari').addEventListener('input', function (e) {
  const q = e.target.value.toLowerCase();
  Object.keys(penanda).forEach(function (id) {
    const m = penanda[id];
    const cocok = !q || m.nama.toLowerCase().indexOf(q) !== -1;
    if (cocok) m.addTo(peta); else peta.removeLayer(m);
  });
});

  const btnDaftar = document.createElement('button');
btnDaftar.textContent = 'Daftar';
btnDaftar.style.cssText = 'position:absolute;z-index:1000;right:10px;bottom:25px;padding:10px 14px;font-size:15px;border:none;border-radius:8px;background:white;box-shadow:0 1px 5px rgba(0,0,0,.4)';
document.body.appendChild(btnDaftar);

const panelDaftar = document.createElement('div');
panelDaftar.style.cssText = 'position:absolute;z-index:1001;right:10px;bottom:75px;width:240px;max-height:55%;overflow:auto;background:white;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.4);display:none';
document.body.appendChild(panelDaftar);

function isiDaftar() {
  const q = document.getElementById('cari').value.toLowerCase();
  const ids = Object.keys(penanda).filter(function (id) {
    return !q || penanda[id].nama.toLowerCase().indexOf(q) !== -1;
  });
  ids.sort(function (a, b) {
    return penanda[a].nama.localeCompare(penanda[b].nama);
  });
  panelDaftar.innerHTML = '<div style="padding:8px;font-weight:bold">Rumah ditandai: ' + ids.length + '</div>';
  ids.forEach(function (id) {
    const item = document.createElement('div');
    item.textContent = penanda[id].nama;
    item.style.cssText = 'padding:10px 8px;border-top:1px solid #eee;cursor:pointer';
    item.onclick = function () {
      const m = penanda[id];
      if (!peta.hasLayer(m)) m.addTo(peta);
      peta.flyTo(m.getLatLng(), 17);
      m.openPopup();
      panelDaftar.style.display = 'none';
    };
    panelDaftar.appendChild(item);
  });
}

btnDaftar.onclick = function () {
  if (panelDaftar.style.display === 'block') {
    panelDaftar.style.display = 'none';
  } else {
    isiDaftar();
    panelDaftar.style.display = 'block';
  }
};

document.getElementById('cari').addEventListener('input', function () {
  if (panelDaftar.style.display === 'block') isiDaftar();
});

  const garisBebasLayer = {};
let titikBebas = [];
let garisSementara = null;

function pasangGarisBebas(g) {
  const titik = typeof g.titik === 'string' ? JSON.parse(g.titik) : g.titik;
  const garis = L.polyline(titik, { color: WARNA[g.warna] || '#000000', weight: 5 }).addTo(peta);
  garis.bindPopup(function () {
    const div = document.createElement('div');
    div.innerHTML = 'Garis bebas<br>';
    const hapus = document.createElement('button');
    hapus.textContent = 'Hapus garis';
    hapus.onclick = function () {
      kirim({ aksi: 'hapusGarisBebas', id: g.id });
      peta.removeLayer(garis);
      delete garisBebasLayer[g.id];
    };
    div.appendChild(hapus);
    return div;
  });
  garisBebasLayer[g.id] = garis;
}

const panelBebas = document.createElement('div');
panelBebas.style.cssText = 'position:absolute;z-index:1000;left:10px;bottom:95px;background:white;padding:8px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.4)';
panelBebas.innerHTML = '<button id="btnBebas">Garis Bebas</button> ' +
  '<select id="warnaBebas">' +
  '<option value="merah">Merah</option>' +
  '<option value="hijau">Hijau</option>' +
  '<option value="kuning">Kuning</option>' +
  '<option value="biru">Biru</option>' +
  '<option value="hitam">Hitam</option>' +
  '</select>' +
  '<div id="aksiBebas" style="display:none;margin-top:6px">' +
  '<button id="btnUndo">Undo</button> <button id="btnSelesai">Selesai</button> <button id="btnBatalBebas">Batal</button>' +
  '</div><div id="infoBebas" style="margin-top:4px;font-size:13px"></div>';
document.body.appendChild(panelBebas);

function gambarSementara() {
  if (garisSementara) peta.removeLayer(garisSementara);
  garisSementara = null;
  if (titikBebas.length > 0) {
    garisSementara = L.polyline(titikBebas, {
      color: WARNA[document.getElementById('warnaBebas').value], weight: 5, dashArray: '8 8'
    }).addTo(peta);
  }
  document.getElementById('infoBebas').textContent = 'Titik: ' + titikBebas.length;
}

function akhiriBebas() {
  modeBebas = false;
  titikBebas = [];
  if (garisSementara) peta.removeLayer(garisSementara);
  garisSementara = null;
  document.getElementById('aksiBebas').style.display = 'none';
  document.getElementById('btnBebas').textContent = 'Garis Bebas';
  document.getElementById('infoBebas').textContent = '';
}

document.getElementById('btnBebas').onclick = function () {
  if (modeBebas) { akhiriBebas(); return; }
  modeBebas = true;
  titikBebas = [];
  this.textContent = 'Menggambar...';
  document.getElementById('aksiBebas').style.display = 'block';
  document.getElementById('infoBebas').textContent = 'Ketuk peta untuk menambah titik';
};

document.getElementById('btnUndo').onclick = function () {
  titikBebas.pop();
  gambarSementara();
};

document.getElementById('btnBatalBebas').onclick = akhiriBebas;

document.getElementById('btnSelesai').onclick = function () {
  if (titikBebas.length < 2) { alert('Minimal dua titik.'); return; }
  const g = { id: Date.now(), titik: titikBebas, warna: document.getElementById('warnaBebas').value };
  pasangGarisBebas(g);
  kirim(Object.assign({ aksi: 'tambahGarisBebas' }, g));
  akhiriBebas();
};

peta.on('click', function (e) {
  if (!modeBebas) return;
  titikBebas.push([e.latlng.lat, e.latlng.lng]);
  gambarSementara();
});

  fetch(API).then(function (r) { return r.json(); })
  .then(function (data) {
    data.penanda.forEach(pasang);
    data.garis.forEach(pasangGaris);
        (data.garisBebas || []).forEach(pasangGarisBebas);
  });
  
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
